<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pumpkin Delight | A Geocaching Puzzle</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#60411f,#1a170f 75%);color:#fff2d3;font-family:Trebuchet MS,system-ui,sans-serif;text-align:center}header{padding:18px 12px 10px}h1{margin:0;color:#ffba49;font-size:clamp(2rem,5vw,3.5rem);text-shadow:0 3px 1px #542500}header p{margin:7px auto;max-width:650px;font-size:1rem}.stage{position:relative;width:min(96vw,900px);margin:14px auto 28px;box-shadow:0 15px 45px #000a;border:7px solid #a36c32;border-radius:16px;overflow:hidden;line-height:0;isolation:isolate}.scene{width:100%;height:auto;display:block}.spot{position:absolute;transform:translate(-50%,-50%);border:0;border-radius:50%;background:transparent;cursor:pointer;z-index:2;touch-action:manipulation}.spot:hover,.spot:focus-visible{outline:3px dashed #ffda6b;background:#ffec8244}.spot:focus-visible{outline-offset:1px}.creature{width:9%;height:9%}.tooth{width:7%;height:7%;z-index:3}.tooth:hover,.tooth:focus-visible{background:#fff6a055}.message{position:absolute;z-index:6;top:4%;left:50%;transform:translateX(-50%);width:max-content;max-width:90%;padding:12px 17px;border-radius:12px;background:#24190de8;color:#ffe4a2;border:2px solid #ffc368;font-size:clamp(14px,2vw,21px);line-height:1.4;box-shadow:0 4px 20px #0009;pointer-events:none;opacity:0;transition:opacity .15s}.message.show{opacity:1}.digit{position:absolute;z-index:7;font-weight:900;color:#ffe77e;text-shadow:2px 3px 0 #6e2a00,0 0 9px #000;font-size:clamp(17px,3.4vw,36px);line-height:1;pointer-events:none;animation:spill 1.65s cubic-bezier(.19,.68,.43,1) forwards}@keyframes spill{0%{transform:translate(0,0) rotate(0deg) scale(.5);opacity:0}12%{opacity:1}65%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}.reveal{position:absolute;z-index:5;bottom:3%;left:50%;transform:translateX(-50%);width:90%;padding:9px;background:#23160df0;border:2px solid #ffb342;border-radius:9px;line-height:1.45;font-size:clamp(15px,2.3vw,24px);font-weight:800;letter-spacing:.035em;display:none}.reveal.show{display:block}.reveal div{margin:3px 0}.footer{padding:0 16px 24px;font-size:.9rem;color:#ecd2a3}button:focus-visible{outline-offset:3px}@media(prefers-reduced-motion:reduce){.digit{animation-duration:.2s}}
</style></head><body><header><h1>🎃 Pumpkin Delight 🎃</h1><p>Some creatures chatter. Some stones stay silent. One pumpkin has a mouthful of secrets. Poke around!</p></header><main><div class="stage" id="stage"><img class="scene" src="pumpkin.png" alt="Goofy grinning pumpkin surrounded by vines, rocks, insects, a snail, lizard, spider, bird and butterfly"><div class="message" id="message" role="status" aria-live="polite"></div><div class="reveal" id="reveal" aria-live="polite"><div id="north"></div><div id="west"></div></div>
<!-- Coordinates are stored client-side, as required for a browser puzzle; curious source readers can inspect them. -->
<button class="spot creature" style="left:8%;top:7%" data-clue="Blue skies, wrong prize!" aria-label="Inspect the bluebird"></button>
<button class="spot creature" style="left:87%;top:8%" data-clue="Flutter by, don't fly by!" aria-label="Inspect the butterfly"></button>
<button class="spot creature" style="left:95%;top:26%" data-clue="Hop to it, pumpkin picker!" aria-label="Inspect the upper grasshopper"></button>
<button class="spot creature" style="left:9%;top:47%" data-clue="Cold blood. Warm trail." aria-label="Inspect the lizard"></button>
<button class="spot creature" style="left:61%;top:39%" data-clue="Spots don't mark the spot!" aria-label="Inspect the ladybug on the nose"></button>
<button class="spot creature" style="left:11%;top:83%" data-clue="Eight legs. Zero coordinates." aria-label="Inspect the spider"></button>
<button class="spot creature" style="left:31%;top:75%" data-clue="Slow down. Look around." aria-label="Inspect the snail"></button>
<button class="spot creature" style="left:84%;top:80%" data-clue="Lucky dots, no digits!" aria-label="Inspect the ladybug on the rock"></button>
<button class="spot creature" style="left:96%;top:57%" data-clue="Jumping won't get you there!" aria-label="Inspect the lower grasshopper"></button>
<button class="spot tooth" style="left:77.5%;top:47.5%" data-tooth="n" aria-label="Inspect an upper-right tooth"></button>
<button class="spot tooth" style="left:57%;top:62.5%" data-tooth="w" aria-label="Inspect a lower-left tooth"></button>
</div></main><div class="footer">Explore the picture. The pumpkin knows more than it lets on. 🍂</div><script>
(()=>{const stage=document.getElementById('stage'),msg=document.getElementById('message'),rev=document.getElementById('reveal');let msgTimer;const found={n:false,w:false};function say(s){msg.textContent=s;msg.classList.add('show');clearTimeout(msgTimer);msgTimer=setTimeout(()=>msg.classList.remove('show'),2500)}function spill(btn,which){const val=which==='n'?'N 29° 36.483':'W 098° 27.706';found[which]=true;const b=btn.getBoundingClientRect(),r=stage.getBoundingClientRect(),cx=b.left+b.width/2-r.left,cy=b.top+b.height/2-r.top;[...val].forEach((ch,i)=>{if(ch===' ')return;const el=document.createElement('span');el.className='digit';el.textContent=ch;el.style.left=cx+'px';el.style.top=cy+'px';const dx=(i-(val.length-1)/2)*Math.min(31,stage.clientWidth/25);const dy=stage.clientHeight*(.21+Math.random()*.13);el.style.setProperty('--dx',dx+'px');el.style.setProperty('--dy',dy+'px');el.style.setProperty('--rot',((Math.random()-.5)*110)+'deg');el.style.animationDelay=(i*75)+'ms';stage.append(el);setTimeout(()=>el.remove(),2800)});say(which==='n'?'The upper tooth has something to say!':'The lower tooth spills another secret!');setTimeout(()=>{document.getElementById(which==='n'?'north':'west').textContent=val;rev.classList.add('show');if(found.n&&found.w)say('A mouthful of coordinates! Happy caching!')},1750)}stage.addEventListener('click',e=>{const btn=e.target.closest('button.spot');if(!btn)return;if(btn.dataset.tooth)spill(btn,btn.dataset.tooth);else say(btn.dataset.clue)})})();
</script></body></html>
