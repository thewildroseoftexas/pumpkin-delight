<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pumpkin Delight | A Geocaching Puzzle</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#60411f,#1a170f 75%);color:#fff2d3;font-family:Trebuchet MS,system-ui,sans-serif;text-align:center}header{padding:18px 12px 10px}h1{margin:0;color:#ffba49;font-size:clamp(2rem,5vw,3.5rem);text-shadow:0 3px 1px #542500}header p{margin:7px auto;max-width:650px;font-size:1rem}.stage{position:relative;width:min(96vw,900px);margin:14px auto 28px;box-shadow:0 15px 45px #000a;border:7px solid #a36c32;border-radius:16px;overflow:hidden;line-height:0;isolation:isolate}.scene{width:100%;height:auto;display:block}.spot{position:absolute;transform:translate(-50%,-50%);border:0;border-radius:50%;background:transparent;cursor:pointer;z-index:2;touch-action:manipulation}.spot:hover,.spot:focus-visible{outline:3px dashed #ffda6b;background:#ffec8244}.spot:focus-visible{outline-offset:1px}.creature{width:9%;height:9%}.tooth{width:7%;height:7%;z-index:3}.tooth:hover,.tooth:focus-visible{background:#fff6a055}.message{position:absolute;z-index:6;top:4%;left:50%;transform:translateX(-50%);width:max-content;max-width:90%;padding:12px 17px;border-radius:12px;background:#24190de8;color:#ffe4a2;border:2px solid #ffc368;font-size:clamp(14px,2vw,21px);line-height:1.4;box-shadow:0 4px 20px #0009;pointer-events:none;opacity:0;transition:opacity .15s}.message.show{opacity:1}.digit{position:absolute;z-index:7;font-weight:900;color:#ffe77e;text-shadow:2px 3px 0 #6e2a00,0 0 9px #000;font-size:clamp(17px,3.4vw,36px);line-height:1;pointer-events:none;animation:spill 1.65s cubic-bezier(.19,.68,.43,1) forwards}@keyframes spill{0%{transform:translate(0,0) rotate(0deg) scale(.5);opacity:0}12%{opacity:1}65%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}.reveal{position:absolute;z-index:5;bottom:3%;left:50%;transform:translateX(-50%);width:90%;padding:9px;background:#23160df0;border:2px solid #ffb342;border-radius:9px;line-height:1.45;font-size:clamp(13px,1.9vw,19px);font-weight:800;letter-spacing:.035em;display:none}.reveal.show{display:block}.reveal div{margin:3px 0}.footer{padding:0 16px 24px;font-size:.9rem;color:#ecd2a3}button:focus-visible{outline-offset:3px}@media(prefers-reduced-motion:reduce){.digit{animation-duration:.2s}}

.creature{width:5.4%;height:5.4%}.tooth{width:2.8%;height:3.2%;z-index:3}.tooth:hover,.tooth:focus-visible{background:#fff6a033}.cipher-text{font-family:ui-monospace,Consolas,monospace;letter-spacing:.04em;overflow-wrap:anywhere}.reveal{max-height:34%;overflow:auto}.reveal .line{display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap}.reveal svg{height:29px;width:auto;max-width:100%;overflow:visible}.reveal .small{font-size:12px;font-weight:normal;color:#ffe5b0}.reveal .north{font-family:ui-monospace,monospace;font-size:clamp(12px,1.8vw,19px);overflow-wrap:anywhere}.message{white-space:normal}.spot:focus-visible{outline:2px dashed #ffda6b}
</style></head><body><header><h1>🎃 Pumpkin Delight 🎃</h1><p>Some creatures chatter. Some stones stay silent. One pumpkin has a mouthful of secrets. Two teeth guard two different secret alphabets. Poke around!</p></header><main><div class="stage" id="stage"><img class="scene" src="pumpkin.png" alt="Goofy grinning pumpkin surrounded by vines, rocks, insects, a snail, lizard, spider, bird and butterfly"><div class="message" id="message" role="status" aria-live="polite"></div><div class="reveal" id="reveal" aria-live="polite"><div id="north"></div><div id="west"></div></div>
<!-- Two different number ciphers protect the hidden destination. -->
<button class="spot creature" style="left:8%;top:7%" data-clue="🐦 𓅃 𓅂 𓅃 𓅁 " aria-label="Inspect the bluebird"></button>
<button class="spot creature" style="left:87%;top:8%" data-clue="Juvfcre jvatf bs fvyrapr..." aria-label="Inspect the butterfly"></button>
<button class="spot creature" style="left:95%;top:26%" data-clue="ᛚᛖᚨᛈ ᛒᛖᚠᛟᚱᛖ ᛃᛟᚢ ᛚᛟᛟᚲ " aria-label="Inspect the upper grasshopper"></button>
<button class="spot creature" style="left:9%;top:47%" data-clue="◔ ◕ ◔◔ ◕◕ ◔◕ " aria-label="Inspect the lizard"></button>
<button class="spot creature" style="left:61%;top:39%" data-clue="Vsrwv klgh qrwklqj." aria-label="Inspect the ladybug on the nose"></button>
<button class="spot creature" style="left:11%;top:83%" data-clue="△ ◇ ⟐ ▽ ◇ △ " aria-label="Inspect the spider"></button>
<button class="spot creature" style="left:31%;top:75%" data-clue="Hold hvxivgh gizevo uzi." aria-label="Inspect the snail"></button>
<button class="spot creature" style="left:84%;top:80%" data-clue=".-- .-. --- -. --. / ... .--. --- -" aria-label="Inspect the ladybug on the rock"></button>
<button class="spot creature" style="left:96%;top:57%" data-clue="10-21-13-16 / 1-7-1-9-14" aria-label="Inspect the lower grasshopper"></button>
<button class="spot tooth" style="left:77.5%;top:47.5%" data-tooth="n" aria-label="Inspect an upper-right tooth"></button>
<button class="spot tooth" style="left:57%;top:62.5%" data-tooth="w" aria-label="Inspect a lower-left tooth"></button>
</div></main><div class="footer">Explore the picture. The pumpkin knows more than it lets on. 🍂</div><script>
(()=>{
const stage=document.getElementById('stage'),msg=document.getElementById('message'),rev=document.getElementById('reveal');
const north=document.getElementById('north'),west=document.getElementById('west');
let msgTimer;
function say(s){msg.textContent=s;msg.classList.add('show');clearTimeout(msgTimer);msgTimer=setTimeout(()=>msg.classList.remove('show'),3500)}
// North: ASCII hexadecimal of the exact latitude, including its degree sign.
const northCipher=Array.from(new TextEncoder().encode('N 29° 36.483')).map(n=>n.toString(16).toUpperCase().padStart(2,'0')).join(' ');
// West: Pigpen symbols for "W AJI° CH.HAG". A-J represent the digits 0-9.
// Standard pigpen letter locations: A-I first grid, J-R dotted grid, S-V first X, W-Z dotted X.
const westLetters='W AJI° CH.HAG';
const NS='http://www.w3.org/2000/svg';
function svgNode(tag,attrs={}){const e=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);return e}
function pigpenGlyph(letter){
 const svg=svgNode('svg',{viewBox:'0 0 32 36',width:'28',height:'32','aria-label':'Pigpen symbol'});
 const g=svgNode('g',{stroke:'#ffe5a2','stroke-width':'2.5',fill:'none','stroke-linecap':'round'});svg.append(g);
 const idx='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.indexOf(letter);if(idx<0)return svg;
 const line=(x1,y1,x2,y2)=>g.append(svgNode('line',{x1,y1,x2,y2}));
 if(idx<18){let n=idx%9,r=Math.floor(n/3),c=n%3;let x=4,y=5,s=24;
 // Each cell has only its own grid boundary lines, standard tic-tac-toe pigpen shape.
 if(c!==0)line(x,y,x,y+s);if(c!==2)line(x+s,y,x+s,y+s);
 if(r!==0)line(x,y,x+s,y);if(r!==2)line(x,y+s,x+s,y+s);
 if(idx>=9)g.append(svgNode('circle',{cx:16,cy:17,r:2.6,fill:'#ffe5a2',stroke:'none'}));
 }else{const n=(idx-18)%4;const d=idx>=22;
 // Four V-shaped regions of an X, rotated around the center.
 const arms=[[[4,4],[16,16],[28,4]],[[28,4],[16,16],[28,28]],[[28,28],[16,16],[4,28]],[[4,28],[16,16],[4,4]]][n];
 line(...arms[0],...arms[1]);line(...arms[1],...arms[2]);
 if(d)g.append(svgNode('circle',{cx:16,cy:17,r:2.6,fill:'#ffe5a2',stroke:'none'}));
 }
 return svg;
}
function westVisual(){const wrap=document.createElement('div');wrap.className='line';wrap.setAttribute('aria-label','Encoded symbols');
 for(const ch of westLetters){if(ch===' '){const gap=document.createElement('span');gap.style.width='10px';wrap.append(gap)}else if(ch==='°'||ch==='.'){const s=document.createElement('span');s.textContent=ch;wrap.append(s)}else wrap.append(pigpenGlyph(ch))}return wrap}
function spill(btn,which){rev.classList.remove('show');north.replaceChildren();west.replaceChildren();
 const b=btn.getBoundingClientRect(),r=stage.getBoundingClientRect(),cx=b.left+b.width/2-r.left,cy=b.top+b.height/2-r.top;
 const pieces=which==='n'?northCipher.split(' '):Array.from(westLetters).filter(c=>c!==' ');
 pieces.forEach((ch,i)=>{const el=document.createElement('span');el.className='digit';el.textContent=which==='n'?ch:(ch==='°'||ch==='.'?ch:'◆');el.style.left=cx+'px';el.style.top=cy+'px';el.style.fontSize=which==='n'?'clamp(12px,2.1vw,23px)':'clamp(16px,2.8vw,31px)';const dx=(i-(pieces.length-1)/2)*Math.min(26,stage.clientWidth/27);const dy=stage.clientHeight*(.15+Math.random()*.12);el.style.setProperty('--dx',dx+'px');el.style.setProperty('--dy',dy+'px');el.style.setProperty('--rot',((Math.random()-.5)*110)+'deg');el.style.animationDelay=(i*45)+'ms';stage.append(el);setTimeout(()=>el.remove(),2700)});
 msg.classList.remove('show');clearTimeout(msgTimer);
 setTimeout(()=>{north.replaceChildren();west.replaceChildren();if(which==='n'){const val=document.createElement('div');val.className='north';val.textContent=northCipher;north.append(val)}else{west.append(westVisual())}rev.classList.add('show')},1400);
}
stage.addEventListener('click',e=>{const btn=e.target.closest('button.spot');if(!btn)return;if(btn.dataset.tooth)spill(btn,btn.dataset.tooth);else say(btn.dataset.clue)});
})();
</script></body></html>
